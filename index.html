idor ni se guarda; tú revisas y confirmas los datos antes de guardarlos. Máquinas de fuerza inteligentes (EGYM): puedes importar tus sesiones de fuerza desde Health Connect (series, repeticiones y peso por ejercicio, si tu aplicación los comparte) o desde una captura del resumen de la máquina, cuyo texto se reconoce en el propio móvil sin enviar ni guardar la imagen. Siempre confirmas qué completa tu plan antes de guardarlo; nada se importa en silencio.</p>

<p>La exportación e importación de datos se hace mediante ficheros que tú generas y controlas. La app no sube nada a la nube. Si activas la copia de seguridad automática de Android, los datos pueden restaurarse vía Google (cifrada, gestionada por el sistema).</p>

<p><strong>YouTube (auf Abruf):</strong> Übungsblätter können Technikvideos über youtube-nocookie.com und die YouTube Data API abspielen. Eine Anfrage erfolgt nur, wenn du ein Blatt öffnest und auf Abspielen tippst.</p>
<p><strong>Übungskatalog:</strong> Übungsdaten und lokal gebündelte Technikvideos stammen von free-exercise-db (MIT-Lizenz). Die App sendet keine Daten an diese Dienste.</p>

<p>Nach erteilter Erlaubnis aktualisiert GymPrime diese Daten automatisch beim Öffnen der Startseite; eine manuelle Synchronisation ist über Mehr → Verbindungen möglich. Die optionalen Direktverbindungen zu Strava und Google Health werden auf strava.com bzw. auf Googles Zustimmungsseite autorisiert: Tokens liegen auf dem GymPrime-Backend (Cloudflare), auf dem Gerät bleibt nur eine zufällige Kennung; widerrufbar unter Verbindungen. Sitzungskalorien werden lokal auf dem Gerät aus abgeschlossenen Sätzen und deinem Gewicht geschätzt; sie werden an keinen Server gesendet.</p>

<h2>Analysen & Tracking</h2>

<p>Export und Import erfolgen über Dateien, die du erstellst und kontrollierst. Die App lädt nichts in die Cloud. Die automatische Android-Sicherung kann App-Daten über Google wiederherstellen (verschlüsselt, systemverwaltet).</p>

<h2>Änderungen & Kontakt</h2>
<p>Änderungen werden auf dieser Seite und im Projekt-Repository veröffentlicht. Bei Fragen öffne ein Issue im Repository.</p>`,

<p><strong>Catalogue d'exercices :</strong> les données des exercices et les vidéos de technique intégrées localement proviennent de free-exercise-db (licence MIT). L'app n'envoie aucune donnée à ces services.</p>
<h2>Health Connect et Strava (facultatifs)</h2>
<p>Après votre autorisation dans Plus → Connexions, GymPrime lit le poids et les séances des 29 derniers jours dans Health Connect (ni parcours ni fréquence cardiaque). Le poids est proposé pour le profil, jamais appliqué sans confirmation. Les minutes de cardio, leur date et leur source restent locales, figurent dans la sauvegarde JSON et n'ajustent que le cardio de la semaine actuelle, sans toucher à la progression de force ni aux plans futurs. Vous pouvez déconnecter chaque intégration depuis Plus → Connexions : Health Connect supprime les données importées de l'appareil et ouvre l'écran des permissions pour les révoquer ; Strava révoque l'accès et supprime les jetons du serveur (le cardio déjà importé reste sur l'appareil). Vous pouvez aussi révoquer les permissions Android et supprimer les données dans GymPrime. Strava et les montres ne fournissent des données que si leur app les partage avec Health Connect ; Strava peut se limiter au GPS. Avec la connexion directe, Strava ne partage que les activités que vous autorisez ; GymPrime ne reçoit jamais votre mot de passe. Avec votre autorisation, GymPrime lit aussi le résumé quotidien des 29 derniers jours (pas, calories, distance, sommeil et fréquence cardiaque au repos) ; il est conservé localement par jour et par source et n'alimente que le panneau d'activité. Machines de gym (Bluetooth) : vous pouvez connecter un tapis, vélo (y compris spinning avec capteur de puissance), elliptique, rameur, stepper ou SkiErg compatible en Bluetooth (FTMS, Concept2, Cycling Power et autres profils standard). Les données en direct (vitesse, distance, calories, fréquence cardiaque et temps) sont lues directement depuis la machine et stockées localement comme cardio externe ; rien n'est envoyé à un serveur. Nécessite l'autorisation Bluetooth. Tu peux aussi associer une ceinture cardiaque Bluetooth standard (données utilisées uniquement pendant la séance) ou ajouter une photo de l'écran de la machine : le texte est reconnu sur le téléphone et l'image n'est jamais envoyée à un serveur ni conservée ; tu vérifies et confirmes les valeurs avant d'enregistrer. Machines de force intelligentes (EGYM) : tu peux importer tes séances de force depuis Health Connect (séries, répétitions et poids par exercice, si ton application les partage) ou depuis une capture du résumé de la machine, dont le texte est reconnu sur ton téléphone sans envoyer ni stocker l'image. Tu confirmes toujours ce que cela complète dans ton plan avant l'enregistrement ; rien n'est importé silencieusement.</p>
<p>Une fois l'autorisation accordée, GymPrime actualise ces données automatiquement à l'ouverture d'Accueil ; une synchro manuelle est possible dans Plus → Connexions. Les connexions directes facultatives Strava et Google Health s'autorisent sur strava.com et sur l'écran de consentement Google : les jetons sont conservés sur le backend GymPrime (Cloudflare) et l'appareil ne garde qu'un identifiant aléatoire ; révocables dans Connexions. Les calories des séances sont estimées localement sur l'appareil à partir des séries terminées et de votre poids ; elles ne sont envoyées à aucun serveur.</p>
<p><strong>IA partagée facultative (Cloudflare) :</strong> l'app inclut un proxy Cloudflare Workers qui transmet vos requêtes IA (chat et génération de plans) au fournisseur (Google Gemini, niveau gratuit). Le stockage KV de Cloudflare conserve un identifiant d'installation aléatoire et des compteurs quotidiens — pas le texte des requêtes — expirant automatiquement au bout de 2 jours. Vos clés API personnelles restent sans limites GymPrime et contournent le proxy partagé. Les données Health Connect ne sont pas automatiquement envoyées à l'IA ; le profil est partagé uniquement selon vos réglages.</p>
<p><strong>Paiements et abonnements (Google Play) :</strong> Premium mensuel ou annuel, l’achat à vie et les dons sont traités par Google Play ; GymPrime ne voit ni ne stocke vos données de paiement. L’appareil conserve seulement l’état d’achat (produit, statut de l’abonnement et un identifiant de commande pour le support), la date de première ouverture pour l’essai de 14 jours et, le cas échéant, vos semaines de vacances. Gérez ou annulez votre abonnement dans Google Play.</p>
<h2>Analytique et suivi</h2>
<p><strong>Aucun.</strong> Pas de SDK d'analytique, de publicité ni de suivi.</p>
<h2>Notifications</h2>
<p>Locales uniquement : avec votre autorisation, le système vous avertit à la fin du repos entre les séries. Elles sont planifiées sur l’appareil ; aucun serveur de notifications ni envoi à distance.</p>
<h2>Sauvegardes</h2>
<p>L'export/import se fait via des fichiers que vous générez et contrôlez. L'app n'envoie rien vers le cloud. La sauvegarde automatique d’Android peut restaurer les données via Google (chiffrée, gérée par le système).</p>
<h2>Suppression</h2>
<p>Supprimez vos données dans les Réglages ou en désinstallant l'app. La suppression locale n'efface pas les compteurs anonymes de l'IA partagée déjà stockés dans Cloudflare ; ils expirent automatiquement au bout de 2 jours.</p>
<h2>Modifications et contact</h2>
<p>Les changements seront publiés sur cette page et dans le dépôt du projet. Pour toute question, ouvrez un ticket dans le dépôt.</p>`,
it: `<h1>Informativa sulla privacy — GymPrime</h1>
<p><em>Ultimo aggiornamento: novembre 2026</em></p>
<h2>Riepilogo</h2>
<p>GymPrime è un'app di allenamento <strong>local-first</strong>: profilo, piani, cronologia e preferenze sono salvati <strong>solo sul tuo dispositivo</strong> (IndexedDB). Nessun account richiesto; l'IA condivisa facoltativa usa Cloudflare Workers come spiegato sotto. Nessuna analitica o pubblicità.</p>
<h2>Dati archiviati (locali)</h2>
<ul>
<li><strong>Profilo:</strong> età, sesso, altezza, peso, obiettivo, livello, giorni di allenamento, attrezzatura, infortuni.</li>
<li><strong>Piani ed esercizi:</strong> serie, ripetizioni, recuperi.</li>
<li><strong>Cronologia:</strong> sessioni (inclusa la loro durata pianificata), record personali, statistiche.</li>
<li><strong>Sfide:</strong> progressi delle sfide, risultati dei test e sfida del giorno (date visualizzate e completate).</li>
<li><strong>Misure e coach:</strong> le misurazioni che registri, la cronologia della chat con l’Allenatore e i tuoi progressi (punti, livello, serie, badge).</li>
<li><strong>Preferenze:</strong> lingua, tema, unità, consensi.</li>
<li><strong>Acquisti:</strong> stato dei tuoi acquisti e abbonamenti Google Play, data della prima apertura (base della prova) e, se usate, le settimane di vacanza segnate.</li></ul>
<h2>Servizi di terze parti</h2>
<p><strong>Provider IA (opzionale):</strong> se configuri una chiave API (OpenRouter o GLM), l'app invia al provider scelto un contesto minimo: obiettivo, livello, giorni e attrezzatura; cronologia e infortuni sono inclusi solo con il tuo consenso esplicito nelle Impostazioni. Le chiavi restano in locale. I messaggi che scrivi nella chat dell’Allenatore vengono inviati al provider scelto per generare la risposta.</p>
<p><strong>YouTube (su richiesta):</strong> le schede degli esercizi possono riprodurre video di tecnica tramite youtube-nocookie.com e la YouTube Data API. La richiesta avviene solo quando apri una scheda e premi play.</p>
<p><strong>Catalogo esercizi:</strong> i dati degli esercizi e i video di tecnica inclusi localmente provengono da free-exercise-db (licenza MIT). L'app non invia dati a questi servizi.</p>
<h2>Health Connect e Strava (facoltativi)</h2>
<p>Dopo aver autorizzato la lettura in Altro → Connessioni, GymPrime legge peso e allenamenti degli ultimi 29 giorni da Health Connect (non percorsi o frequenza cardiaca). Il peso viene proposto per il profilo, mai applicato senza conferma. Minuti di cardio, data e origine restano in locale, sono inclusi nel backup JSON e modificano solo il cardio di questa settimana, non la progressione di forza o i piani futuri. Puoi disconnettere ogni integrazione da Altro → Connessioni: Health Connect elimina i dati importati dal dispositivo e apre la schermata dei permessi per revocarli; Strava revoca l'accesso ed elimina i token del server (il cardio già importato resta sul dispositivo). Puoi anche revocare i permessi Android e cancellare i dati in GymPrime. Strava e orologi forniscono dati solo se la loro app li condivide con Health Connect; Strava può condividere solo attività GPS. Con la connessione diretta, Strava condivide solo le attività che autorizzi; GymPrime non riceve mai la tua password. Se autorizzata, GymPrime legge anche il riepilogo giornaliero degli ultimi 29 giorni (passi, calorie, distanza, sonno e frequenza cardiaca a riposo); viene conservato in locale per giorno e fonte e alimenta solo il pannello attività. Macchine da palestra (Bluetooth): puoi connettere un tapis roulant, bici (anche spinning con misuratore di potenza), ellittica, vogatore, stepper o SkiErg compatibili via Bluetooth (FTMS, Concept2, Cycling Power e altri profili standard). I dati in tempo reale (velocità, distanza, calorie, frequenza cardiaca e tempo) vengono letti direttamente dalla macchina e salvati in locale come cardio esterno; nulla viene inviato a un server. Richiede il permesso Bluetooth. Puoi anche associare una fascia cardio Bluetooth standard (dati usati solo durante la sessione) o aggiungere una foto della schermata della macchina: il testo viene riconosciuto sul telefono e l'immagine non viene mai inviata a un server né salvata; controlli e confermi i valori prima di salvare. Macchine di forza intelligenti (EGYM): puoi importare le tue sessioni di forza da Health Connect (serie, ripetizioni e peso per esercizio, se la tua app le condivide) o da una cattura del riepilogo della macchina, il cui testo viene riconosciuto sul telefono senza inviare né salvare l'immagine. Confermi sempre cosa completa nel piano prima di salvare; nulla viene importato silenziosamente.</p>
<p>Una volta concesso il permesso, GymPrime aggiorna questi dati automaticamente all'apertura di Home; puoi anche sincronizzare manualmente da Altro → Connessioni. Le connessioni dirette facoltative a Strava e Google Health si autorizzano su strava.com e sulla schermata di consenso di Google: i token restano sul backend GymPrime (Cloudflare) e sul dispositivo resta solo un identificativo casuale; revocabili da Connessioni. Le calorie delle sessioni sono stimate localmente sul dispositivo da serie completate e peso; non vengono inviate a nessun server.</p>
<p><strong>IA condivisa facoltativa (Cloudflare):</strong> l'app include un proxy Cloudflare Workers che inoltra le tue richieste IA (chat e generazione di piani) al fornitore (Google Gemini, livello gratuito). Lo storage KV di Cloudflare conserva un identificativo casuale di installazione e contatori giornalieri — non il testo delle richieste — che scadono automaticamente entro 2 giorni. Le chiavi API personali sono senza limiti GymPrime e non usano il proxy condiviso. I dati Health Connect non vengono inviati automaticamente all'IA; il profilo solo secondo le tue impostazioni di privacy.</p>
<p><strong>Pagamenti e abbonamenti (Google Play):</strong> Premium mensile o annuale, l’acquisto a vita e le donazioni sono elaborati da Google Play; GymPrime non vede né salva i dati di pagamento. Sul dispositivo restano solo lo stato d’acquisto (prodotto, stato dell’abbonamento e un ID ordine per l’assistenza), la data della prima apertura per la prova di 14 giorni e, se usate, le settimane di vacanza. Gestisci o annulla l’abbonamento da Google Play.</p>
<h2>Analitica e tracciamento</h2>
<p><strong>Nessuna.</strong> Nessun SDK di analitica, pubblicità o tracciamento.</p>
<h2>Notifiche</h2>
<p>Solo locali: con il tuo permesso il sistema ti avvisa alla fine del recupero tra le serie. Sono programmate sul dispositivo; nessun server di notifiche né invii remoti.</p>
<h2>Backup</h2>
<p>Export e import avvengono tramite file che generi e controlli tu. L'app non carica nulla nel cloud. Il backup automatico di Android può ripristinare i dati tramite Google (cifrato, gestito dal sistema).</p>
<h2>Eliminazione</h2>
<p>Elimina i dati dalle Impostazioni o disinstallando l'app. L'eliminazione locale non cancella i contatori anonimi dell'IA condivisa già memorizzati su Cloudflare; scadono automaticamente entro 2 giorni.</p>
<h2>Modifiche e contatti</h2>
<p>Le modifiche saranno pubblicate su questa pagina e nel repository del progetto. Per domande, apri una issue nel repository.</p>`,
ja: `<h1>プライバシーポリシー — GymPrime</h1>

<p>GymPrimeは<strong>ローカルファースト</strong>のトレーニングアプリです。プロフィール、プラン、履歴、設定は<strong>お使いのデバイス内のみ</strong>（IndexedDB）に保存されます。アカウントは不要です。任意の共有AIは以下に記すCloudflare Workersを利用します。分析や広告はありません。</p>

<li><strong>設定：</strong>言語、テーマ、単位、同意事項。</li>

<h2>第三者サービス</h2>
<p><strong>AIプロバイダー（任意）：</strong>APIキー（OpenRouterまたはGLM）を設定した場合、アプリは選択したプロバイダーに最小限のコンテキスト（目標、レベル、日数、器具）のみを送信します。履歴や怪我は設定で明示的に同意した場合のみ含まれます。キーはローカルに保存されます。コーチチャットで入力したメッセージは、回答生成のため選択したプロバイダーへ送信されます。</p>
<p><strong>YouTube（オンデマンド）：</strong>エクササイズ詳細ではyoutube-nocookie.comとYouTube Data APIを通じてテクニック動画を再生できます。詳細を開き再生ボタンを押したときのみリクエストが行われます。</p>
<p><strong>エクササイズカタログ：</strong>エクササイズデータとローカル同梱のテクニック動画はfree-exercise-db（MITライセンス）由来です。これらのサービスへデータは送信されません。</p>
<h2>Health ConnectとStrava（任意）</h2>
<p>その他 → 接続 で許可した場合、GymPrimeはHealth Connectの過去29日間の体重と運動記録を読み取ります（経路や心拍数は読み取りません）。最新の体重はプロフィール更新の候補として表示し、確認なしに変更しません。有酸素運動の時間・日付・提供元は端末内に保存され、JSONバックアップに含まれます。今週の有酸素運動のみ調整し、筋力の進捗や将来の計画は変更しません。その他 → 接続 から各連携を解除できます。Health Connectではインポート済みデータが端末から削除され、権限画面が開いて取り消せます。Stravaではアクセスが取り消され、サーバーのトークンが削除されます（インポート済みの有酸素記録は端末に残ります）。Androidで権限を取り消し、GymPrimeでデータを削除することもできます。時計やStravaのアプリがHealth Connectに共有した場合のみデータが届きます。StravaはGPS運動のみの場合があります。直接連携では、Stravaは許可したアクティビティのみを共有し、GymPrimeがパスワードを受け取ることはありません。 日次サマリーを許可した場合、過去29日分の歩数・消費カロリー・距離・睡眠・安静時心拍数も読み取ります。日付とソースごとに端末内へ保存され、アクティビティパネルの表示にのみ使われます。 ジムマシン（Bluetooth）：対応するトレッドミル、バイク（パワーメーター付きスピンバイク含む）、エリプティカル、ローイング、ステアクライマー、SkiErgをBluetooth（FTMS、Concept2、Cycling Powerなどの標準プロファイル）で接続できます。ライブデータ（速度、距離、消費カロリー、心拍数、時間）はマシンから直接読み取り、外部有酸素として端末内に保存します。サーバーへは送信されません。Bluetooth権限が必要です。標準的なBluetooth心拍ベルトの接続（セッション中のみ使用）や、マシン画面の写真からの追加も可能です。文字は端末内で認識され、画像はサーバーに送信も保存もされません。保存前に必ず値を確認・確定します。 スマート筋力マシン（EGYM）：Health Connect から筋力セッション（種目ごとのセット・回数・重量。アプリが共有する場合）を取り込むか、マシンのサマリーのキャプチャから取り込めます。テキストは端末内で認識され、画像は送信も保存もされません。保存前にプランの何を完了するか必ず確認します。黙って取り込まれることはありません。</p>
<p>許可後はホームを開くたびにこれらのデータが自動更新されます（その他 → 接続 から手動同期も可能）。任意のStrava直接連携はstrava.comで、Google Health連携はGoogleの同意画面で認可され、トークンはGymPrimeバックエンド（Cloudflare）に保存されます。端末にはランダムな識別子のみ残り、接続画面からいつでも取り消せます。セッションの消費カロリーは完了したセットと体重から端末内で推定され、サーバーへは送信されません。</p>
<p><strong>共有AI（任意、Cloudflare）：</strong>アプリにはCloudflare Workersのプロキシが含まれ、AIリクエスト（チャットおよびプラン生成）をプロバイダー（Google Gemini・無料枠）へ転送します。CloudflareのKVストレージにはランダムなインストールIDと日次利用回数のみ保存され（質問文は保存されず）、2日で自動的に期限切れになります。個人のAPIキーはGymPrimeの利用制限を受けず、共有プロキシを使いません。Health Connectの記録は自動的にAIへ送信されず、プロフィールはプライバシー設定に従います。</p>
<p><strong>支払いとサブスクリプション（Google Play）:</strong> 月額・年額 Premium、永久購入、寄付は Google Play で処理されます。GymPrime が支払い情報を見る・保存することはありません。デバイスには購入状態（商品、サブスクリプション状態、サポート用の注文 ID）、14日間トライアルの初回起動日、および使用した場合の休暇週のみ保存されます。サブスクリプションの管理・解約は Google Play から行えます。</p>
<h2>分析とトラッキング</h2>
<p><strong>なし。</strong>分析、広告、トラッキングSDKは一切ありません。</p>
<h2>通知</h2>
<p>ローカルのみ：許可した場合、セット間の休憩終了をシステムがお知らせします。デバイス上でスケジュールされ、通知サーバーやリモート送信はありません。</p>
<h2>バックアップ</h2>
<p>エクスポート／インポートはあなたが生成・管理するファイル経由です。クラウドへの送信はありません。 Androidの自動バックアップが有効な場合、アプリのデータはGoogle経由で復元されることがあります（暗号化、システム管理）。</p>
<h2>削除</h2>
<p>設定から、またはアプリをアンインストールしてデータを削除できます。端末内の削除は、Cloudflareに既に保存された共有AIの匿名利用回数を削除しません。保存期間（2日）で自動的に期限切れになります。</p>
<h2>変更と連絡先</h2>
<p>変更はこのページとプロジェクトリポジトリに掲載されます。お問い合わせはリポジトリのIssueへ。</p>`,
pl: `<h1>Polityka prywatności — GymPrime</h1>
<p><em>Ostatnia aktualizacja: listopad 2026</em></p>
<h2>Podsumowanie</h2>
<p>GymPrime to aplikacja treningowa <strong>local-first</strong>: profil, plany, historia i preferencje są przechowywane <strong>wyłącznie na Twoim urządzeniu</strong> (IndexedDB). Konto nie jest wymagane; opcjonalna wspólna AI korzysta z Cloudflare Workers, jak opisano niżej. Bez analityki i reklam.</p>
<h2>Przechowywane dane (lokalne)</h2>
<ul>
<li><strong>Profil:</strong> wiek, płeć, wzrost, waga, cel, poziom, dni treningowe, sprzęt, kontuzje.</li>
<li><strong>Plany i ćwiczenia:</strong> serie, powtórzenia, przerwy.</li>
<li><strong>Historia:</strong> sesje (w tym ich planowany czas trwania), rekordy osobiste, statystyki.</li>
<li><strong>Wyzwania:</strong> postępy w wyzwaniach, wyniki testów i wyzwanie dnia (daty wyświetlenia i ukończenia).</li>
<li><strong>Pomiary i trener:</strong> zapisane pomiary ciała, historia czatu z Trenerem oraz postępy (punkty, poziom, serie, odznaki).</li>
<li><strong>Preferencje:</strong> język, motyw, jednostki, zgody.</li>
<li><strong>Zakupy:</strong> stan zakupów i subskrypcji Google Play, data pierwszego otwarcia (podstawa okresu próbnego) oraz — jeśli używane — zaznaczone tygodnie urlopowe.</li></ul>
<h2>Usługi zewnętrzne</h2>
<p><strong>Dostawcy AI (opcjonalnie):</strong> jeśli skonfigurujesz klucz API (OpenRouter lub GLM), aplikacja wysyła wybranemu dostawcy minimalny kontekst: cel, poziom, dni i sprzęt; historia i kontuzje są dołączane tylko za Twoją wyraźną zgodą w Ustawieniach. Klucze są przechowywane lokalnie. Wiadomości wpisane na czacie Trenera są wysyłane do wybranego dostawcy w celu wygenerowania odpowiedzi.</p>
<p><strong>YouTube (na żądanie):</strong> karty ćwiczeń mogą odtwarzać filmy techniki przez youtube-nocookie.com i YouTube Data API. Żądanie jest wysyłane tylko po otwarciu karty i naciśnięciu odtwarzania.</p>
<p><strong>Katalog ćwiczeń:</strong> dane ćwiczeń i lokalnie dołączone filmy techniki pochodzą z free-exercise-db (licencja MIT). Aplikacja nie wysyła danych do tych usług.</p>
<h2>Health Connect i Strava (opcjonalnie)</h2>
<p>Po udzieleniu zgody w Więcej → Połączenia GymPrime odczytuje masę ciała i treningi z ostatnich 29 dni w Health Connect (bez tras i tętna). Najnowsza masa jest proponowana jako zmiana profilu, nigdy wprowadzana bez potwierdzenia. Minuty kardio, data i źródło pozostają lokalne, są w kopii JSON i modyfikują tylko kardio bieżącego tygodnia, nie postępy siłowe ani przyszłe plany. Każdą integrację możesz odłączyć w Więcej → Połączenia: Health Connect usuwa zaimportowane dane z urządzenia i otwiera ekran uprawnień, aby je cofnąć; Strava odbiera dostęp i usuwa tokeny z serwera (zaimportowane cardio zostaje na urządzeniu). Możesz też cofnąć zgodę w Androidzie i usunąć dane w GymPrime. Zegarki i Strava dostarczają dane tylko, jeśli ich aplikacje udostępniają je w Health Connect; Strava może udostępniać tylko aktywności GPS. Przy połączeniu bezpośrednim Strava udostępnia tylko autoryzowane przez Ciebie aktywności; GymPrime nie otrzymuje Twojego hasła. Za zgodą GymPrime odczytuje też dzienne podsumowania z ostatnich 29 dni (kroki, kalorie, dystans, sen i tętno spoczynkowe); są przechowywane lokalnie według dnia i źródła i zasilają wyłącznie panel aktywności. Maszyny na siłowni (Bluetooth): możesz połączyć kompatybilną bieżnię, rower (także spinning z pomiarem mocy), orbitrek, wioślarza, stepper lub SkiErg przez Bluetooth (FTMS, Concept2, Cycling Power i inne profile standardowe). Dane na żywo (prędkość, dystans, kalorie, tętno i czas) są odczytywane bezpośrednio z maszyny i zapisywane lokalnie jako cardio zewnętrzne; nic nie jest wysyłane na serwer. Wymaga uprawnienia Bluetooth. Możesz też sparować standardowy pas piersiowy Bluetooth (dane tylko podczas sesji) albo dodać zdjęcie ekranu maszyny: tekst jest rozpoznawany na telefonie, a zdjęcie nigdy nie jest wysyłane na serwer ani zapisywane; wartości sprawdzasz i potwierdzasz przed zapisem. Inteligentne maszyny siłowe (EGYM): możesz importować sesje siłowe z Health Connect (serie, powtórzenia i ciężar dla każdego ćwiczenia, jeśli Twoja aplikacja je udostępnia) lub ze zrzutu podsumowania maszyny, którego tekst jest rozpoznawany w telefonie bez wysyłania i zapisywania obrazu. Zawsze potwierdzasz, co uzupełnia w planie, zanim zostanie zapisane; nic nie jest importowane po cichu.</p>
<p>Po udzieleniu zgody GymPrime odświeża te dane automatycznie przy otwarciu ekranu głównego; synchronizacja ręczna jest też dostępna w Więcej → Połączenia. Opcjonalne bezpośrednie połączenia ze Stravą i Google Health autoryzujesz na strava.com oraz na ekranie zgody Google: tokeny przechowuje backend GymPrime (Cloudflare), a na urządzeniu zostaje tylko losowy identyfikator; możesz je odwołać w Połączeniach. Kalorie sesji są szacowane lokalnie na urządzeniu na podstawie ukończonych serii i masy ciała; nie są wysyłane na żaden serwer.</p>
<p><strong>Opcjonalna wspólna AI (Cloudflare):</strong> aplikacja zawiera proxy Cloudflare Workers, które przekazuje zapytania AI (czat i generowanie planów) do dostawcy (Google Gemini, darmowy poziom). Magazyn KV Cloudflare przechowuje losowy identyfikator instalacji i dzienne liczniki — nie tekst zapytań — wygasające automatycznie po 2 dniach. Własny klucz API nie podlega limitom GymPrime i omija wspólne proxy. Rekordy Health Connect nie są automatycznie udostępniane AI; dane profilu zależą od ustawień prywatności.</p>
<p><strong>Płatności i subskrypcje (Google Play):</strong> Premium miesięczne lub roczne, zakup dożywotni i darowizny są przetwarzane przez Google Play; GymPrime nie widzi ani nie przechowuje danych płatności. Na urządzeniu zostają tylko stan zakupu (produkt, status subskrypcji i identyfikator zamówienia do pomocy), data pierwszego otwarcia dla 14-dniowego okresu próbnego oraz — jeśli używane — tygodnie urlopowe. Subskrypcją zarządzasz i anulujesz ją w Google Play.</p>
<h2>Analityka i śledzenie</h2>
<p><strong>Brak.</strong> Żadnych SDK analitycznych, reklamowych ani śledzących.</p>
<h2>Powiadomienia</h2>
<p>Wyłącznie lokalne: po udzieleniu zgody system powiadomi Cię o końcu przerwy między seriami. Są planowane na urządzeniu; brak serwera powiadomień i zdalnych komunikatów.</p>
<h2>Kopie zapasowe</h2>
<p>Eksport i import odbywa się przez pliki, które generujesz i kontrolujesz. Aplikacja niczego nie wysyła do chmury. Automatyczna kopia zapasowa Androida może przywrócić dane przez Google (szyfrowana, zarządzana systemowo).</p>
<h2>Usuwanie danych</h2>
<p>Usuń dane w Ustawieniach lub odinstalowując aplikację. Usunięcie lokalne nie usuwa anonimowych liczników wspólnej AI zapisanych już w Cloudflare; wygasają automatycznie po 2 dniach.</p>
<h2>Zmiany i kontakt</h2>
<p>Zmiany będą publikowane na tej stronie i w repozytorium projektu. W razie pytań otwórz zgłoszenie w repozytorium.</p>`,

<p><strong>AI-провайдеры (опционально):</strong> если вы настроите API-ключ (OpenRouter или GLM), приложение отправит выбранному провайдеру минимальный контекст: цель, уровень, дни и оборудование; история и травмы включаются только с вашего явного согласия в Настройках. Ключи хранятся локально. Сообщения в чате Тренера отправляются выбранному провайдеру для генерации ответа.</p>

<h2>Health Connect и Strava (необязательно)</h2>
<p>После предоставления разрешения в разделе Ещё → Подключения GymPrime считывает вес и тренировки за последние 29 дней из Health Connect (без маршрутов и пульса). Последний вес предлагается для профиля и не применяется без подтверждения. Минуты кардио, дата и источник хранятся локально, входят в резервную копию JSON и влияют только на кардио текущей недели, а не на силовую прогрессию или будущие планы. Каждую интеграцию можно отключить в Ещё → Подключения: Health Connect удаляет импортированные данные с устройства и открывает экран разрешений для их отзыва; Strava отзывает доступ и удаляет токены с сервера (уже импортированное кардио остаётся на устройстве). Разрешение также можно отозвать в Android, а данные удалить в GymPrime. Часы и Strava передают данные, только если их приложения делятся ими через Health Connect; Strava может передавать лишь GPS-активности. При прямом подключении Strava передаёт только разрешённые вами активности; GymPrime не получает ваш пароль. При разрешении GymPrime также считывает дневные сводки за последние 29 дней (шаги, калории, дистанцию, сон и пульс в покое); они хранятся локально по дате и источнику и используются только для панели активности. Тренажёры (Bluetooth): вы можете подключить совместимую беговую дорожку, велосипед (в т. ч. спин-байк с измерителем мощности), эллипсоид, греблю, степпер или SkiErg по Bluetooth (FTMS, Concept2, Cycling Power и другие стандартные профили). Данные в реальном времени (скорость, дистанция, калории, пульс и время) считываются прямо с тренажёра и сохраняются локально как внешнее кардио; ничего не отправляется на сервер. Требуется разрешение Bluetooth. Умные силовые тренажёры (EGYM): вы можете импортировать силовые сессии из Health Connect (подходы, повторы и вес по каждому упражнению, если ваше приложение их передаёт) или со скриншота итогов тренажёра — текст распознаётся на телефоне без отправки и сохранения изображения. Вы всегда подтверждаете, что именно завершается в плане, перед сохранением; ничего не импортируется незаметно.</p>
<p>После предоставления разрешения GymPrime обновляет эти данные автоматически при открытии главного экрана; также доступна ручная синхронизация в Ещё → Подключения. Опциональные прямые подключения Strava и Google Health авторизуются на strava.com и на экране согласия Google: токены хранятся на бэкенде GymPrime (Cloudflare), на устройстве остаётся лишь случайный идентификатор; отозвать можно в Подключениях. Калории тренировок оцениваются локально на устройстве по выполненным подходам и весу; они никуда не отправляются.</p>
<p><strong>Общий ИИ (необязательно, Cloudflare):</strong> приложение включает прокси на Cloudflare Workers, передающий ваши запросы ИИ (чат и генерация планов) провайдеру (Google Gemini, бесплатный уровень). Хранилище KV Cloudflare хранит случайный идентификатор установки и дневные счётчики — не текст запросов — с автоматическим истечением через 2 дня. Собственный API-ключ не ограничен GymPrime и не использует общий прокси. Данные Health Connect не передаются ИИ автоматически, профиль — только согласно настройкам приватности.</p>
<p><strong>Платежи и подписки (Google Play):</strong> месячная или годовая подписка Premium, пожизненная покупка и пожертвования обрабатываются Google Play; GymPrime не видит и не хранит платёжные данные. На устройстве сохраняются только состояние покупки (продукт, статус подписки и идентификатор заказа для поддержки), дата первого запуска для 14-дневного пробного периода и, если используется, недели отпуска. Управление и отмена подписки — в Google Play.</p>
<h2>Аналитика и отслеживание</h2>
<p><strong>Нет.</strong> Никаких SDK аналитики, рекламы или трекинга.</p>
<h2>Уведомления</h2>
<p>Только локальные: с вашего разрешения система сообщает о конце отдыха между подходами. Планируются на устройстве; сервера уведомлений и удалённой отправки нет.</p>
<h2>Резервные копии</h2>
<p>Экспорт и импорт выполняются через файлы, которые вы создаёте и контролируете. Приложение ничего не отправляет в облако. Автоматическое резервное копирование Android может восстановить данные через Google (зашифровано, управляется системой).</p>

<p>Удалите данные в Настройках или удалением приложения. Локальное удаление не удаляет уже сохранённые в Cloudflare анонимные счётчики использования ИИ; их срок хранения истекает автоматически через 2 дня.</p>
<h2>Изменения и контакты</h2>
<p>Изменения публикуются на этой странице и в репозитории проекта. По вопросам откройте issue в репозитории.</p>`,
tr: `<h1>Gizlilik Politikası — GymPrime</h1>

<ul>
<li><strong>Profil:</strong> yaş, cinsiyet, boy, kilo, hedef, seviye, antrenman günleri, ekipman, sakatlıklar.</li>
<li><strong>Planlar ve egzersizler:</strong> setler, tekrarlar, dinlenmeler.</li>
<li><strong>Geçmiş:</strong> seanslar (planlanan süreleri dahil), kişisel rekorlar, istatistikler.</li>
<li><strong>Meydan okumalar:</strong> meydan okuma ilerlemesi, test sonuçları ve günün meydan okuması (görüntülenen ve tamamlanan tarihler).</li>
<li><strong>Ölçümler ve koç:</strong> girdiğiniz vücut ölçümleri, Antrenör sohbeti geçmişi ve ilerlemeniz (puanlar, seviye, seriler, rozetler).</li>
<li><strong>Tercihler:</strong> dil, tema, birimler, onaylar.</li>
<li><strong>Satın alımlar:</strong> Google Play satın alma ve abonelik durumunuz, ilk açılış tarihi (deneme temeli) ve kullanılıyorsa işaretlediğiniz tatil haftaları.</li></ul>
<h2>Üçüncü taraf servisler</h2>
<p><strong>AI sağlayıcıları (isteğe bağlı):</strong> bir API anahtarı (OpenRouter veya GLM) yapılandırırsanız, uygulama seçtiğiniz sağlayıcıya yalnızca asgari bağlam gönderir: hedef, seviye, günler ve ekipman; geçmiş ve sakatlıklar yalnızca Ayarlar'da açık onay verirseniz dahil edilir. Anahtarlar yerel olarak saklanır. Antrenör sohbetine yazdığınız mesajlar yanıt üretmek için seçtiğiniz sağlayıcıya gönderilir.</p>
<p><strong>YouTube (isteğe bağlı):</strong> egzersiz kartları, youtube-nocookie.com ve YouTube Data API üzerinden teknik videoları oynatabilir. İstek yalnızca kartı açıp oynata bastığınızda yapılır.</p>
<p><strong>Egzersiz kataloğu:</strong> egzersiz verileri ve yerel olarak paketlenmiş teknik videolar free-exercise-db'den (MIT lisansı) gelir. Uygulama bu servislere veri göndermez.</p>
<h2>Health Connect ve Strava (isteğe bağlı)</h2>
<p>Diğer → Bağlantılar'da izin verdikten sonra GymPrime Health Connect'ten son 29 günün kilosunu ve antrenmanlarını okur (rota ve nabız değil). En güncel kilo profil için önerilir, onay olmadan uygulanmaz. Kardiyo dakikaları, tarih ve kaynak yerel kalır, JSON yedeğine girer; yalnızca bu haftanın kardiyosunu ayarlar, güç gelişimini ve gelecek planları değiştirmez. Her entegrasyonu Diğer → Bağlantılar bölümünden kesebilirsiniz: Health Connect, içe aktarılan verileri cihazdan siler ve izinleri geri almanız için izin ekranını açar; Strava erişimi iptal eder ve sunucu tokenlarını siler (içe aktarılmış kardiyo cihazda kalır). İzinleri Android'den geri alabilir, verileri GymPrime'tan da silebilirsiniz. Saatler ve Strava yalnızca kendi uygulamaları Health Connect'e veri paylaşıyorsa katkı sağlar; Strava yalnızca GPS etkinliklerini paylaşabilir. Doğrudan bağlantıda Strava yalnızca yetkilendirdiğiniz etkinlikleri paylaşır; GymPrime parolanızı asla almaz. Günlük özet izni verirseniz GymPrime son 29 günün adım, kalori, mesafe, uyku ve dinlenme nabzı verilerini de okur; bunlar gün ve kaynak bazında yerel saklanır ve yalnızca aktivite panelini besler. Spor aletleri (Bluetooth): uyumlu bir koşu bandı, bisiklet (güç ölçerli spinning dahil), eliptik, kürek, stepper veya SkiErg'ü Bluetooth (FTMS, Concept2, Cycling Power ve diğer standart profiller) ile bağlayabilirsiniz. Canlı veriler (hız, mesafe, kalori, nabız ve süre) doğrudan makineden okunur ve harici kardiyo olarak yerel saklanır; hiçbir sunucuya gönderilmez. Bluetooth izni gerektirir. Ayrıca standart bir Bluetooth nabız bandı eşleştirebilir (veriler yalnızca seans sırasında kullanılır) veya makine ekranının fotoğrafını ekleyebilirsiniz: metin telefonda tanınır ve görüntü hiçbir sunucuya gönderilmez veya saklanmaz; değerleri kaydetmeden önce siz kontrol edip onaylarsınız. Akıllı güç makineleri (EGYM): güç seanslarını Health Connect'ten (uygulaman paylaşıyorsa egzersiz başına set, tekrar ve ağırlık) veya makine özetinin ekran görüntüsünden içe aktarabilirsin; metin telefonda tanınır, görüntü gönderilmez veya kaydedilmez. Kaydetmeden önce planında neyi tamamladığını her zaman onaylarsın; hiçbir şey sessizce içe aktarılmaz.</p>
<p>İzin verildikten sonra GymPrime, Ana Sayfa'yı her açışınızda bu verileri otomatik olarak yeniler; ayrıca Diğer → Bağlantılar'dan elle senkronize edebilirsiniz. İsteğe bağlı doğrudan Strava ve Google Health bağlantıları strava.com'da ve Google izin ekranında yetkilendirilir: belirteçler GymPrime arka ucunda (Cloudflare) saklanır ve cihazda yalnızca rastgele bir tanımlayıcı kalır; Bağlantılar'dan iptal edebilirsiniz. Antrenman kalorileriniz tamamlanan setlerden ve kilonuzdan cihazda yerel olarak tahmin edilir; hiçbir sunucuya gönderilmez.</p>
<p><strong>İsteğe bağlı paylaşılan yapay zekâ (Cloudflare):</strong> uygulama, yapay zekâ isteklerinizi (sohbet ve plan oluşturma) sağlayıcıya (Google Gemini, ücretsiz katman) ileten bir Cloudflare Workers proxy'si içerir. Cloudflare KV deposu rastgele bir kurulum kimliği ve günlük kullanım sayaçlarını saklar —istek metnini değil— ve 2 gün sonra kendiliğinden sona erer. Kendi API anahtarınız GymPrime sınırlarına tabi değildir ve paylaşılan proxy'yi kullanmaz. Health Connect kayıtları otomatik olarak yapay zekâya gönderilmez; profil yalnızca gizlilik tercihlerinize göre paylaşılır.</p>
<p><strong>Ödemeler ve abonelikler (Google Play):</strong> aylık veya yıllık Premium, ömür boyu satın alma ve bağışlar Google Play tarafından işlenir; GymPrime ödeme bilgilerinizi görmez veya saklamaz. Cihazda yalnızca satın alma durumu (ürün, abonelik durumu ve destek için sipariş kimliği), 14 günlük deneme için ilk açılış tarihi ve kullanılıyorsa tatil haftalarınız tutulur. Aboneliğinizi Google Play’den yönetebilir veya iptal edebilirsiniz.</p>
<h2>Analitik ve izleme</h2>
<p><strong>Yok.</strong> Analitik, reklam veya izleme SDK'sı bulunmaz.</p>
<h2>Bildirimler</h2>
<p>Yalnızca yerel: izin verirseniz sistem, setler arası dinlenmenin bittiğini bildirir. Cihazda zamanlanır; bildirim sunucusu veya uzaktan gönderim yoktur.</p>
<h2>Yedeklemeler</h2>
<p>Dışa/içe aktarma, sizin oluşturduğunuz ve kontrol ettiğiniz dosyalarla yapılır. Uygulama buluta hiçbir şey göndermez. Android’in otomatik yedeklemesi verileri Google aracılığıyla geri yükleyebilir (şifreli, sistem yönetimli).</p>

zh: `<h1>隐私政策 — GymPrime</h1>
<p><em>最后更新：2026年11月</em></p>
<h2>概述</h2>
<p>GymPrime 是一款<strong>本地优先</strong>的训练应用：个人资料、计划、历史记录和偏好设置<strong>仅存储在您的设备上</strong>（IndexedDB）。无需账户；可选的共享 AI 使用下述 Cloudflare Workers。无分析或广告。</p>
<h2>存储的数据（本地）</h2>
<ul>
<li><strong>个人资料：</strong>年龄、性别、身高、体重、目标、水平、训练日、器械、伤病。</li>
<li><strong>计划和练习：</strong>组数、次数、休息时间。</li>
<li><strong>历史：</strong>训练记录（含计划时长）、个人最佳、统计。</li>
<li><strong>挑战：</strong>挑战进度、测试成绩和每日挑战（显示和完成的日期）。</li>
<li><strong>测量与教练：</strong>您记录的身体测量数据、教练聊天记录以及游戏化进度（积分、等级、连续记录和徽章）。</li>
<li><strong>偏好：</strong>语言、主题、单位、同意项。</li>
<li><strong>购买：</strong>您的 Google Play 购买和订阅状态、首次打开日期（试用期依据），以及您标记的假期周（如使用）。</li></ul>
<h2>第三方服务</h2>
<p><strong>AI 提供商（可选）：</strong>如果您配置了 API 密钥（OpenRouter 或 GLM），应用仅向所选提供商发送最小化上下文：目标、水平、天数和器械；历史记录和伤病仅在您在设置中明确同意时才会包含。密钥存储在本地。您在教练聊天中输入的消息会发送给所选提供商以生成回复。</p>
<p><strong>YouTube（按需）：</strong>练习详情可通过 youtube-nocookie.com 和 YouTube Data API 播放技术视频。仅在您打开详情并点击播放时才发出请求。</p>
<p><strong>练习目录：</strong>练习数据和本地打包的技术视频来自 free-exercise-db（MIT 许可）。应用不向这些服务发送数据。</p>
<h2>Health Connect 与 Strava（可选）</h2>
<p>在“更多 → 连接”中授权后，GymPrime 会读取 Health Connect 过去29天的体重及运动记录（不读取路线或心率）。最新体重仅作为更新个人资料的建议，未经确认绝不修改。有氧活动的时长、日期及来源仅存储在设备上，包含在 JSON 备份中，仅调整本周有氧训练，不影响力量进度或未来计划。您可以在 更多 → 连接 中断开各集成：Health Connect 会删除设备上已导入的数据并打开权限界面以便撤销；Strava 会撤销授权并删除服务器令牌（已导入的有氧记录保留在设备上）。也可以在 Android 撤销权限，在 GymPrime 删除数据。手表和 Strava 只有在各自应用向 Health Connect 共享数据时才提供记录；Strava 可能仅共享 GPS 活动。直接连接时，Strava 仅共享您授权的活动；GymPrime 不会收到您的密码。 如您允许读取每日摘要，GymPrime 还会读取过去29天的步数、卡路里、距离、睡眠和静息心率；这些数据按日期和来源保存在本地，仅用于活动面板展示。 健身器材（蓝牙）：您可以通过蓝牙（FTMS、Concept2、Cycling Power 等标准协议）连接兼容的跑步机、单车（含功率计动感单车）、椭圆机、划船机、登山机或 SkiErg。实时数据（速度、距离、卡路里、心率和时间）直接从器材读取，并作为外部有氧运动保存在本地；不会发送到任何服务器。需要蓝牙权限。你还可以配对标准蓝牙心率带（数据仅在训练期间使用），或通过拍摄器械屏幕照片添加记录：文字在手机上识别，图片不会发送到任何服务器也不会被保存；保存前由你核对并确认数值。 智能力量器械（EGYM）：你可以从 Health Connect 导入力量训练（若你的应用共享，则含每个动作的组数、次数和重量），或通过器械摘要的截图导入——文字在手机本地识别，图片不会上传或保存。保存前你始终需要确认它完成计划中的哪一部分；不会静默导入任何内容。</p>
<p>授权后，GymPrime 会在每次打开首页时自动更新这些数据；也可在“更多 → 连接”中手动同步。可选的 Strava 与 Google Health 直接连接分别在 strava.com 和 Google 同意页面上授权：令牌保存在 GymPrime 后端（Cloudflare），设备上仅保留随机标识符，可随时在“连接”中撤销。训练消耗的卡路里在设备上根据已完成的组数和体重本地估算，不会发送到任何服务器。</p>
<p><strong>可选共享 AI（Cloudflare）：</strong>应用内置 Cloudflare Workers 代理，将您的 AI 请求（聊天和计划生成）转发至服务商（Google Gemini，免费层级）。Cloudflare KV 存储仅保存随机安装标识及每日使用计数——不保存请求文本——并在 2 天内自动过期。自有 API 密钥不受 GymPrime 使用次数限制，也不使用共享代理。Health Connect 的记录不会自动发送至 AI；个人资料是否发送取决于您的隐私设置。</p>
<p><strong>付款与订阅（Google Play）：</strong>月度或年度 Premium、永久购买和捐赠均由 Google Play 处理；GymPrime 不会查看或存储您的付款信息。设备上仅保存购买状态（产品、订阅状态和用于支持的订单 ID）、14 天试用的首次打开日期，以及您标记的假期周（如使用）。您可以在 Google Play 中管理或取消订阅。</p>
<h2>分析与追踪</h2>
<p><strong>无。</strong>无任何分析、广告或追踪 SDK。</p>
<h2>通知</h2>
<p>仅限本地：获得许可后，系统会在组间休息结束时提醒您。通知在设备上调度，没有通知服务器或远程推送。</p>
<h2>备份</h2>
<p>导出/导入通过您生成和控制的文件进行。应用不会向云端上传任何内容。 Android 自动备份可通过 Google 恢复应用数据（加密，由系统管理）。</p>
<h2>删除</h2>
<p>可在设置中或卸载应用来删除数据。本地删除不会删除 Cloudflare 中已存储的共享 AI 匿名使用计数；它们将在保留期（2 天）后自动过期。</p>
<h2>变更与联系</h2>
<p>变更将发布在本页面和项目仓库中。如有疑问请在仓库中提交 issue。</p>`,

const NAMES = {es:"Español",en:"English",de:"Deutsch",fr:"Français",it:"Italiano",ja:"日本語",pl:"Polski",ru:"Русский",tr:"Türkçe",zh:"中文"};
const sel = document.getElementById("langSel");
for (const k of Object.keys(T)) {
  const o = document.createElement("option");
  o.value = k; o.textContent = NAMES[k];
  sel.appendChild(o);
}
function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  const nav = (navigator.language || "es").slice(0, 2).toLowerCase();
  return T[q] ? q : (T[nav] ? nav : "es");
}
function show(l) {
  document.getElementById("c").innerHTML = T[l];
  document.documentElement.lang = l;
  document.title = document.querySelector("#c h1").textContent;
  sel.value = l;
}
sel.addEventListener("change", () => show(sel.value));
// Modo embebido (dentro del modal de la app): la cabecera del modal trae
// su propio selector y cambia el idioma por postMessage; aquí se oculta la
// barra y se escucha el mensaje. En la web pública funciona standalone.
if (new URLSearchParams(location.search).get("embed") === "1")
  document.body.classList.add("embed");
window.addEventListener("message", (e) => {
  if (e.origin === location.origin && e.data?.type === "setLang" && T[e.data.lang])
    show(e.data.lang);
});
show(pick());
</script>
